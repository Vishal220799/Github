name: Hello Vishal

on:
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "HELLO VISHAL"

      - name: Create secret file
        env:
          SECRET_CONTENT: ${{ secrets.VISHAL_SECRET }}
        run: |
          printf '%s\n' "$SECRET_CONTENT" > secret.env

      - name: Verify secret file exists
        run: |
          test -f secret.env
          echo "Secret file created successfully"
